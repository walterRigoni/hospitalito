name: Apply Hospitalito v228 clean

on:
  push:
    paths:
      - ".github/workflows/apply-v228-clean.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact v227 base and apply validated patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b = Path('index.html').read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          expected = 'dbcef3f362a4489b6208b8b70f800ea3e86a07c9'
          print('index.html blob:', sha)
          if sha != expected:
              raise SystemExit(f'Base inesperada: {sha} != {expected}')
          PY
          git apply --check .hospitalito/v228.patch
          git apply .hospitalito/v228.patch
          grep -q 'HC Demo v228 · Supabase' index.html
          grep -q 'id="hcSettingsModal"' index.html
          grep -q 'id="btnOpenSettings"' index.html

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Hospitalito v228: configuración, temas y auditoría"
          git push

# trigger: v228 validated publisher
