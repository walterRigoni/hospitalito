name: Apply Hospitalito v228

on:
  push:
    paths:
      - ".github/workflows/apply-v228.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v228:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current Hospitalito v227 base
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          b=p.read_bytes()
          sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='dbcef3f362a4489b6208b8b70f800ea3e86a07c9'
          print('index.html blob:', sha)
          if sha != expected:
              raise SystemExit(f'Base inesperada: {sha} != {expected}')
          PY

      - name: Apply validated v228 patch
        shell: bash
        env:
          PATCH_B64: >-
            [...truncated...]
        shell: bash
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/v228.patch
          git apply --check /tmp/v228.patch
          git apply /tmp/v228.patch
          grep -q 'HC Demo v228 · Supabase' index.html
          grep -q 'id="hcSettingsModal"' index.html
          grep -q 'id="btnOpenSettings"' index.html

      - name: Commit and publish v228
        shell: bash
        run: |
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Hospitalito v228: configuración, temas y auditoría" || exit 0
          git push
