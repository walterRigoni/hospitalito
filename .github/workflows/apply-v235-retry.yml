name: Retry Hospitalito v235 login recovery

on:
  push:
    paths:
      - ".github/workflows/apply-v235-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v235 patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY'
          import base64,gzip,subprocess,hashlib
          from pathlib import Path
          p=Path('index.html'); b=p.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='bf95a0a756ee04131101556d78e69d73fce67720'
          if got!=expected: raise SystemExit(f'Base inesperada: {got} != {expected}')
          patch=gzip.decompress(base64.b64decode(__import__('os').environ['PATCH_B64']))
          Path('/tmp/v235.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v235.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v235.patch'],check=True)
          out=p.read_bytes(); newsha=hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()
          expected_new='2c7a4607fe36fc53a434cd7bb0569182644829d4'
          if newsha!=expected_new: raise SystemExit(f'Resultado inesperado: {newsha} != {expected_new}')
          print('v235 exacta:',newsha)
          PY

      - name: Publish and clean one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-v235.yml .github/workflows/apply-v235-retry.yml
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-v235.yml .github/workflows/apply-v235-retry.yml
          git commit -m "Hospitalito v235: login Supabase robusto"
          git push
