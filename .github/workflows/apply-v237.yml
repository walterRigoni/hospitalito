name: Apply Hospitalito v237

on:
  push:
    paths:
      - ".github/workflows/apply-v237.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v237 patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64,gzip,hashlib,os,subprocess
          p=Path('index.html')
          b=p.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='e5697b426d6b2b25c98d10b9bcc3b1092841f720'
          if got != expected:
              raise SystemExit(f'Base inesperada: {got} != {expected}')
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode('utf-8')
          Path('/tmp/v237.patch').write_text(patch,encoding='utf-8')
          subprocess.run(['patch','-p1','-i','/tmp/v237.patch'],check=True)
          out=p.read_bytes()
          newsha=hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()
          expected_new='c21292669a7f4c36de0a04bd383b352ba0d6c6dc'
          if newsha != expected_new:
              raise SystemExit(f'Resultado inesperado: {newsha} != {expected_new}')
          sw=Path('service-worker.js')
          if sw.exists():
              text=sw.read_text(encoding='utf-8')
              text=text.replace("const CACHE='hospitalito-v236';","const CACHE='hospitalito-v237';")
              sw.write_text(text,encoding='utf-8')
          print('v237 validada:',newsha)
          PY2

      - name: Publish and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v237.yml
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js .github/workflows/apply-v237.yml
          git commit -m "Hospitalito v237: controles de presentador y pantalla completa"
          git push
