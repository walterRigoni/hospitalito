name: Publish Hospitalito v228 final

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact validated v228 patch when needed
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'HC Demo v228 · Supabase' index.html; then
            echo 'v228 already present; nothing to apply.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b = Path('index.html').read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          expected = 'dbcef3f362a4489b6208b8b70f800ea3e86a07c9'
          print('index.html blob:', sha)
          if sha != expected:
              raise SystemExit(f'Base inesperada: {sha} != {expected}')
          PY
          base64 -d .hospitalito/v228.patch.gz.b64 | gzip -d > /tmp/v228.patch
          git apply --check /tmp/v228.patch
          git apply /tmp/v228.patch
          grep -q 'HC Demo v228 · Supabase' index.html
          grep -q 'id="hcSettingsModal"' index.html
          grep -q 'id="btnOpenSettings"' index.html
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit and publish
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Hospitalito v228: configuración, temas y auditoría"
          git push
