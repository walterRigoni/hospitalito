name: Apply Hospitalito v236 login calls

on:
  push:
    paths:
      - ".github/workflows/apply-v236.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact v236 patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY2'
          import base64,gzip,subprocess,hashlib,os
          from pathlib import Path
          p=Path('index.html'); b=p.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='255ada759ee746f294f6e9673b6ea296795def58'
          if got!=expected: raise SystemExit(f'Base inesperada: {got} != {expected}')
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          Path('/tmp/v236.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/v236.patch'],check=True)
          subprocess.run(['git','apply','/tmp/v236.patch'],check=True)
          out=p.read_bytes(); newsha=hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()
          expected_new='e5697b426d6b2b25c98d10b9bcc3b1092841f720'
          if newsha!=expected_new: raise SystemExit(f'Resultado inesperado: {newsha} != {expected_new}')
          print('v236 validada:',newsha)
          PY2
      - name: Publish and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v236.yml
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-v236.yml
          git commit -m "Hospitalito v236: login inmediato y llamadas estables"
          git push
