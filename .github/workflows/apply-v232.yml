        with:
          fetch-depth: 0
      - name: Verify v231 base
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('index.html').read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='e6939f49c59328d810462ed1e8f1645b68d25d4d'
          print('base',got)
          if got!=expected:
              raise SystemExit(f'Base inesperada: {got}')
          PY
