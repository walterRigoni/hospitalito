name: Finalize Hospitalito v235 login recovery

on:
  push:
    paths:
      - ".github/workflows/apply-v235-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v234 to v235
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          b=p.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          expected='bf95a0a756ee04131101556d78e69d73fce67720'
          if got != expected:
              raise SystemExit(f'Base inesperada: {got} != {expected}')
          s=b.decode('utf-8')
          s=s.replace('<title>HC Demo v234 · Supabase</title>','<title>HC Demo v235 · Supabase</title>',1)
          s=s.replace('document.title=`(${n}) HC Demo v234 · Supabase`','document.title=`(${n}) HC Demo v235 · Supabase`')
          s=s.replace("document.title='HC Demo v234 · Supabase'","document.title='HC Demo v235 · Supabase'")
          old='''  const AUTH_URL="https://frbuhczonftjtvmviehw.supabase.co/functions/v1/hospitalito-auth";\n  const PUB_KEY="sb_publishable_izvgUn3YKK4i_GD1OB5C6A_UJQl93ol";\n  let authReadyPromise=null;\n\n  async function authRequest(action,payload={}){\n    let last=null;\n    for(let attempt=0;attempt<2;attempt++){\n      const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),18000);\n      try{\n        const r=await fetch(AUTH_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUB_KEY},body:JSON.stringify({action,...(payload||{})}),cache:"no-store",signal:ctl.signal});\n        const text=await r.text();let j={};try{j=text?JSON.parse(text):{};}catch(_){const e=new Error("Supabase devolvió una respuesta de autenticación inválida.");e.noRetry=true;throw e;}\n        if(!r.ok||!j?.ok){const e=new Error(j?.error||`Supabase HTTP ${r.status}`);e.noRetry=r.status<500;throw e;}\n        return j;\n      }catch(e){last=e;if(e?.noRetry||attempt===1)throw e;await new Promise(res=>setTimeout(res,220));}\n      finally{clearTimeout(timer);}\n    }\n    throw last||new Error("No se pudo conectar con Supabase.");\n  }'''
          new='''  const AUTH_URL="https://frbuhczonftjtvmviehw.supabase.co/functions/v1/hospitalito-auth";\n  const LOGIN_URL="https://frbuhczonftjtvmviehw.supabase.co/functions/v1/hospitalito-login";\n  const PUB_KEY="sb_publishable_izvgUn3YKK4i_GD1OB5C6A_UJQl93ol";\n  let authReadyPromise=null;\n\n  async function hc235AuthFetch(url,action,payload={},timeoutMs=45000){\n    const ctl=new AbortController();\n    let timedOut=false;\n    const timer=setTimeout(()=>{timedOut=true;try{ctl.abort(new DOMException("Hospitalito agotó el tiempo de espera de Supabase.","TimeoutError"));}catch(_){ctl.abort();}},timeoutMs);\n    try{\n      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUB_KEY},body:JSON.stringify({action,...(payload||{})}),cache:"no-store",signal:ctl.signal});\n      const text=await r.text();let j={};\n      try{j=text?JSON.parse(text):{};}catch(_){const e=new Error("Supabase devolvió una respuesta de autenticación inválida.");e.noRetry=true;throw e;}\n      if(!r.ok||!j?.ok){const e=new Error(j?.error||`Supabase HTTP ${r.status}`);e.noRetry=r.status<500;throw e;}\n      return j;\n    }catch(e){\n      if(timedOut||e?.name==="AbortError"||e?.name==="TimeoutError"){const x=new Error("Supabase tardó demasiado en responder. Hospitalito volverá a intentar sin perder tus datos locales.");x.timeout=true;throw x;}\n      throw e;\n    }finally{clearTimeout(timer);}\n  }\n\n  async function authRequest(action,payload={}){\n    let last=null;\n    const isLogin=action==="authenticateUser";\n    const primary=isLogin?LOGIN_URL:AUTH_URL;\n    const attempts=isLogin?3:2;\n    for(let attempt=0;attempt<attempts;attempt++){\n      try{\n        return await hc235AuthFetch(primary,action,payload,isLogin?45000:30000);\n      }catch(e){\n        last=e;\n        if(e?.noRetry)throw e;\n        if(attempt<attempts-1)await new Promise(res=>setTimeout(res,350+attempt*450));\n      }\n    }\n    if(isLogin){\n      try{return await hc235AuthFetch(AUTH_URL,action,payload,60000);}catch(e){last=e;}\n    }\n    throw last||new Error("No se pudo conectar con Supabase.");\n  }'''
          if old not in s:
              raise SystemExit('No se encontró el bloque auth v234 esperado')
          s=s.replace(old,new,1)
          s=s.replace("window.HC_DEMO_VERSION='v233';const $=s=>document.querySelector(s);","window.HC_DEMO_VERSION='v235';const $=s=>document.querySelector(s);",1)
          marker='''\n<script id="hc-v235-login-fix">\n(()=>{\n  'use strict';\n  window.HC_DEMO_VERSION='v235';\n  try{document.title='HC Demo v235 · Supabase';}catch(_){ }\n})();\n</script>\n'''
          idx=s.lower().rfind('</body>')
          if idx < 0: idx=s.lower().rfind('</html>')
          s=s[:idx]+marker+s[idx:]
          p.write_text(s,encoding='utf-8')
          out=p.read_bytes()
          newsha=hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()
          expected_new='255ada759ee746f294f6e9673b6ea296795def58'
          if newsha != expected_new:
              raise SystemExit(f'Resultado inesperado: {newsha} != {expected_new}')
          print('v235 validada:',newsha)
          PY

      - name: Publish and clean one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-v235.yml .github/workflows/apply-v235-retry.yml .github/workflows/apply-v235-final.yml
          git config user.name "ChatGPT Hospitalito"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-v235.yml .github/workflows/apply-v235-retry.yml .github/workflows/apply-v235-final.yml
          git commit -m "Hospitalito v235: login Supabase robusto"
          git push
